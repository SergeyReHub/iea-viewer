services:
  backend:
    build:
      context: ./backend
    container_name: iea-viewer-v2-backend
    environment:
      IEA_DB_URL: ${IEA_DB_URL:-postgresql://postgres:postgres@192.168.245.32:5432/iea_data}
      PGHOST: ${PGHOST:-192.168.245.32}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-iea_data}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:-postgres}
      SOURCES_CONFIG: /config/sources.yaml
      API_PORT: ${API_PORT:-8010}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUDIT_VIEWER_IPS: ${AUDIT_VIEWER_IPS:-}
      IDENTITY_IP_MAP_EXTRA: ${IDENTITY_IP_MAP_EXTRA:-}  
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_HOST_PORT:-8010}:8010"
    volumes:
      - ./backend:/app
      - ./config:/config:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
    container_name: iea-viewer-v2-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-}
      VITE_DEV_API_PROXY: http://backend:8015
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5180:5180"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5180').then(() => process.exit(0)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  frontend_node_modules:
