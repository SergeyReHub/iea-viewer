stages:
  - build
  - release
  - deploy
  - logs

variables:
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
  BACKEND_RELEASE_IMAGE: $CI_REGISTRY_IMAGE/backend:latest
  FRONTEND_RELEASE_IMAGE: $CI_REGISTRY_IMAGE/frontend:latest
  MODULE_NAME: "iea-viewer-v2"
  GIT_CLEAN_FLAGS: -ffdx -e deploy/.env -e deploy/storage/ -e deploy/storage/**
  # Classic builder uses local Hub images without a metadata/token round-trip
  # (BuildKit times out against docker.io from this runner).
  DOCKER_BUILDKIT: "0"

before_script:
  - echo $CI_JOB_TOKEN | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY

build-backend:
  stage: build
  tags:
    - docker50
  script:
    - |
      ensure_hub_image() {
        local image="$1"
        if docker image inspect "$image" >/dev/null 2>&1; then
          echo "Using local image $image"
          return 0
        fi
        local n=0
        while [ "$n" -lt 4 ]; do
          n=$((n + 1))
          echo "Pulling $image (attempt $n/4)"
          if docker pull "$image"; then
            return 0
          fi
          sleep $((n * 15))
        done
        echo "Failed to pull $image and no local copy"
        return 1
      }
      ensure_hub_image python:3.12-slim
      docker build -t "$BACKEND_IMAGE" -f backend/Dockerfile.prod .
    - docker push $BACKEND_IMAGE

build-frontend:
  stage: build
  tags:
    - docker50
  script:
    - |
      ensure_hub_image() {
        local image="$1"
        if docker image inspect "$image" >/dev/null 2>&1; then
          echo "Using local image $image"
          return 0
        fi
        local n=0
        while [ "$n" -lt 4 ]; do
          n=$((n + 1))
          echo "Pulling $image (attempt $n/4)"
          if docker pull "$image"; then
            return 0
          fi
          sleep $((n * 15))
        done
        echo "Failed to pull $image and no local copy"
        return 1
      }
      ensure_hub_image node:20-alpine
      ensure_hub_image nginx:1.27-alpine
      docker build -t "$FRONTEND_IMAGE" -f frontend/Dockerfile.prod frontend
    - docker push $FRONTEND_IMAGE

release-images:
  stage: release
  tags:
    - docker50
  script:
    - docker pull $BACKEND_IMAGE
    - docker tag $BACKEND_IMAGE $BACKEND_RELEASE_IMAGE
    - docker push $BACKEND_RELEASE_IMAGE
    - docker pull $FRONTEND_IMAGE
    - docker tag $FRONTEND_IMAGE $FRONTEND_RELEASE_IMAGE
    - docker push $FRONTEND_RELEASE_IMAGE
  only:
    - master
  needs:
    - build-backend
    - build-frontend

deploy-code-job:
  stage: deploy
  tags:
    - docker50
  script:
    - echo "=== Server IP ==="
    - echo "IP сервера (runner) $(hostname -I 2>/dev/null | awk '{print $1}' || echo 'N/A')"
    - |
      if [ -n "${ENV_FILE:-}" ]; then
        if [ -f "$ENV_FILE" ]; then
          cp "$ENV_FILE" deploy/.env
        else
          printf '%s\n' "$ENV_FILE" > deploy/.env
        fi
      fi
    - if [ ! -f deploy/.env ]; then echo "deploy/.env not found"; exit 1; fi
    - echo "BACKEND_IMAGE=$BACKEND_RELEASE_IMAGE" >> deploy/.env
    - echo "FRONTEND_IMAGE=$FRONTEND_RELEASE_IMAGE" >> deploy/.env
    - chmod +x deploy/stop-v1.sh deploy/deploy.sh
    - bash deploy/stop-v1.sh
    - docker compose --env-file deploy/.env -f deploy/docker-compose.yml down --remove-orphans || true
    - docker compose --env-file deploy/.env -f deploy/docker-compose.yml pull
    - docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d
    - echo "=== Waiting for backend ==="
    - |
      for attempt in $(seq 1 30); do
        if curl -sf http://127.0.0.1:8010/api/health >/dev/null; then
          break
        fi
        sleep 2
      done
    - curl -sf http://127.0.0.1:8010/api/health
    - |
      PRESET_COUNT=$(docker compose --env-file deploy/.env -f deploy/docker-compose.yml exec -T backend \
        python -c "import json, urllib.request; print(len(json.load(urllib.request.urlopen('http://127.0.0.1:8010/api/v2/sources/iea/presets')).get('presets', [])))")
      echo "Presets available: $PRESET_COUNT"
      if [ "${PRESET_COUNT:-0}" -lt 30 ]; then
        echo "Warning: expected at least 30 presets"
        exit 1
      fi
    - curl -sf http://127.0.0.1:5180/ >/dev/null
    - echo "=== iea-viewer-v2 is live on ports 8010 (API) and 5180 (UI) ==="
  only:
    - master
  needs:
    - release-images

view-logs:
  stage: logs
  tags:
    - docker50
  script:
    - echo "=== Server IP ==="
    - echo "IP сервера (runner) $(hostname -I 2>/dev/null | awk '{print $1}' || echo 'N/A')"
    - if [ ! -f deploy/.env ]; then echo "deploy/.env not found"; exit 1; fi
    - docker compose --env-file deploy/.env -f deploy/docker-compose.yml logs --tail=1000
  only:
    - master
  needs:
    - deploy-code-job
